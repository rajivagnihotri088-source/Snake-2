
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Green Snake Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🐍 3D SNAKE GAME</h1>

    <h2>Score: <span id="score">0</span></h2>

    <div id="game-wrapper"></div>

    <button id="startBtn" onclick="startGame()">START GAME</button>
    <button onclick="restartGame()">RESTART</button>

    <div class="controls">
        <button onclick="changeDirection('UP')">⬆️</button>
        <div>
            <button onclick="changeDirection('LEFT')">⬅️</button>
            <button onclick="changeDirection('DOWN')">⬇️</button>
            <button onclick="changeDirection('RIGHT')">➡️</button>
        </div>
    </div>

    <p id="message">Press START GAME to play!</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>

</body>
</html>
